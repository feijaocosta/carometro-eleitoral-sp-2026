name: Atualizar dados TSE

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Atualiza resultados TSE')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar dados oficiais de candidaturas
        run: |
          mkdir -p tmp/tse data fotos
          curl -L --fail --retry 3 "https://cdn.tse.jus.br/estatistica/sead/odsele/consulta_cand/consulta_cand_2026.zip" -o tmp/tse.zip
          unzip -o tmp/tse.zip -d tmp/tse

      - name: Baixar fotos oficiais de SP e Presidencia
        run: |
          rm -rf tmp/fotos fotos
          mkdir -p tmp/fotos fotos
          curl -L --fail --retry 3 "https://cdn.tse.jus.br/estatistica/sead/eleicoes/eleicoes2026/fotos/foto_cand2026_SP_div.zip" -o tmp/fotos-sp.zip
          curl -L --fail --retry 3 "https://cdn.tse.jus.br/estatistica/sead/eleicoes/eleicoes2026/fotos/foto_cand2026_BR_div.zip" -o tmp/fotos-br.zip
          unzip -o tmp/fotos-sp.zip -d tmp/fotos
          unzip -o tmp/fotos-br.zip -d tmp/fotos
          python3 - <<'PY'
          import glob, os, shutil
          for f in glob.glob('tmp/fotos/**/*.jpg', recursive=True) + glob.glob('tmp/fotos/**/*.jpeg', recursive=True):
              shutil.copy2(f, os.path.join('fotos', os.path.basename(f)))
          print('Fotos:', len(glob.glob('fotos/*')))
          PY

      - name: Baixar resultado parcial oficial do TSE — Deputado Federal SP
        run: |
          mkdir -p data tmp/tse-result
          cat > /tmp/tse-capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const url = 'https://resultados.tse.jus.br/oficial/app/index.html#/eleicao/6257/uf/sp/cargo/6/vis/nominal/resultados';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const hits = [];
          page.on('response', async (response) => {
            const u = response.url();
            const ct = response.headers()['content-type'] || '';
            if (!ct.includes('json') && !/\.json(?:[?#]|$)/i.test(u)) return;
            try {
              const body = await response.text();
              if (/carg|cand|eleitor|totaliz|votos|agrup/i.test(body)) {
                const safe = String(hits.length).padStart(3,'0');
                fs.writeFileSync('/tmp/tse-capture-' + safe + '.json', body);
                hits.push({url:u,status:response.status(),size:body.length,file:'/tmp/tse-capture-' + safe + '.json'});
                console.log('JSON CANDIDATOS:', response.status(), body.length, u);
              }
            } catch {}
          });
          await page.goto(url, {waitUntil:'domcontentloaded', timeout:120000});
          await page.waitForTimeout(30000);
          console.log('PAGE TITLE:', await page.title());
          console.log('HITS:', JSON.stringify(hits,null,2));
          if (!hits.length) process.exit(2);
          fs.copyFileSync(hits[0].file, 'data/resultado-sp-deputado-federal.json');
          await browser.close();
          JS
          npm init -y >/dev/null 2>&1
          npm install playwright --no-fund --no-audit >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
          node /tmp/tse-capture.mjs
          python3 - <<'PY'
          import json
          p='data/resultado-sp-deputado-federal.json'
          with open(p,encoding='utf-8') as f: j=json.load(f)
          print('CAPTURADO:', type(j).__name__)
          if isinstance(j,dict): print('CHAVES:', list(j.keys())[:30])
          PY
      - name: Gerar JSON de SP mais Presidencia
        run: |
          python3 - <<'PY'
          import csv, json, glob, os
          all_files = glob.glob('tmp/tse/**/*.csv', recursive=True)
          sp_files = [p for p in all_files if p.upper().endswith('_SP.CSV')]
          if not sp_files: raise SystemExit('Nenhum CSV de SP encontrado')
          paths = sorted([p for p in all_files if os.path.basename(p).upper().startswith('CONSULTA_CAND_2026_') and p.upper().endswith('.CSV')])
          if not paths: paths = sp_files
          out=[]
          for path in paths:
              with open(path, 'r', encoding='latin-1', newline='') as f:
                  sample=f.read(8192); f.seek(0)
                  dialect=csv.Sniffer().sniff(sample, delimiters=';,|')
                  reader=csv.DictReader(f, dialect=dialect)
                  for r in reader:
                      def v(*keys):
                          for k in keys:
                              if k in r and r[k]: return r[k].strip()
                          return ''
                      nome=v('NM_URNA_CANDIDATO','NM_CANDIDATO')
                      cargo=v('DS_CARGO')
                      numero=v('NR_CANDIDATO')
                      if not (nome and cargo and numero): continue
                      is_national = 'PRESIDENTE' in cargo.upper()
                      if not is_national and '_SP.' not in path.upper() and not path.upper().endswith('_SP.CSV'): pass
                      sq=v('SQ_CANDIDATO')
                      foto=''
                      for prefix in ('FSP','FBR','BR','SP'):
                          for suffix in ('_div.jpg','_div.jpeg','.jpg','.jpeg'):
                              candidate=prefix+sq+suffix
                              if os.path.exists(os.path.join('fotos',candidate)):
                                  foto='fotos/'+candidate; break
                          if foto: break
                      out.append({'nome':nome,'partido':v('SG_PARTIDO'),'cargo':cargo,'numero':numero,'sq':sq,'situacao':v('DS_SITUACAO_CANDIDATURA','DS_SITUACAO'),'estado':('BR' if is_national else os.path.basename(path).upper().split('_')[-1].split('.')[0]),'foto':foto})
          with open('data/candidatos-brasil.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,separators=(',',':'))
          print('Total:',len(out))
          print('Com foto:',sum(1 for x in out if x['foto']))
          print('Presidente:',sum(1 for x in out if 'PRESIDENTE' in x['cargo'].upper()))
          PY

      - name: Publicar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidatos-brasil.json data/resultado-sp-deputado-federal.json data/parcial-deputados-sp.json fotos/
          if git diff --cached --quiet; then echo "Sem alterações"; else git commit -m "Atualiza resultados TSE"; git push; fi
